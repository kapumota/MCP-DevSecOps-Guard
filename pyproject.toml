[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillchain-mcp-guard"
version = "0.1.0"
description = "Guard local-first de seguridad MCP, skills y evidencia DevSecOps."
requires-python = ">=3.12"

[project.scripts]
skillchain = "devsecops_agent.cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["devsecops_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "A"]
ignore = ["B904"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
