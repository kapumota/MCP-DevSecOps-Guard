[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillchain-mcp-guard"
version = "0.1.0"
description = "Guard local-first de seguridad MCP, skills y evidencia DevSecOps."
requires-python = ">=3.12"

[project.scripts]
skillchain = "devsecops_agent.cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["devsecops_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "A"]
ignore = ["B904"]

[tool.ruff.lint.per-file-ignores]
"src/devsecops_agent/dashboard.py" = ["E501"]
"src/devsecops_agent/cli.py" = ["E501"]
"src/devsecops_agent/artifacts.py" = ["E501"]
"src/devsecops_agent/evaluation_harness.py" = ["E501"]
"src/devsecops_agent/evidence_pack.py" = ["E501"]
"src/devsecops_agent/local_evidence.py" = ["E501"]
"src/devsecops_agent/mcp_auditor.py" = ["E501"]
"src/devsecops_agent/policy_engine.py" = ["E501"]
"src/devsecops_agent/skill_scanner.py" = ["E501"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", ".skillchain", ".semgrep", ".tools"]